[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "anki-vocabulary"
version = "0.1.0"
description = "Local Wayland vocabulary capture and on-demand Ollama to Anki pipeline"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9,<3", "python-dotenv>=1.0,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
wordnet = ["nltk>=3.9,<4"]

[project.scripts]
vocab-capture = "capture:main"
vocab-worker = "worker:main"
vocab-queue = "database:main"

[tool.setuptools]
py-modules = ["config", "database", "capture", "generator", "anki_client", "worker", "http_client", "log_utils", "grounding", "ollama_process"]
packages = ["migrations"]

[tool.setuptools.package-data]
migrations = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
